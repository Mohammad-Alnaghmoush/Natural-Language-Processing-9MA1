name: Execute Lab 7 and save outputs
on:
  push:
    paths:
      - '.github/workflows/lab7-execute.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install NLP notebook dependencies
        run: python -m pip install --quiet 'transformers==4.46.3' 'huggingface-hub<1.0' sentencepiece nbformat nbclient ipykernel
      - name: Execute all examples and tasks
        run: python execute_lab7.py
      - name: Commit notebook with outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lab7_LLMs_Completed.ipynb
          git diff --cached --quiet || git commit -m 'Save executed Lab 7 model outputs'
          git push
