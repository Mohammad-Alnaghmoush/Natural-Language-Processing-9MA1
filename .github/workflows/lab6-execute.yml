name: Execute both Lab 6 notebooks on Yelp dataset
on:
  push:
    paths:
      - '.github/workflows/lab6-execute.yml'
      - 'execute_lab6.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install scientific and notebook dependencies
        run: python -m pip install --quiet pandas numpy 'scipy<1.13' 'gensim==4.3.3' scikit-learn nbformat nbclient ipykernel
      - name: Run and verify both notebooks
        run: python execute_lab6.py
      - name: Commit executed notebooks and saved results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab6_NLP.ipynb lab6__NLP.ipynb
          git diff --cached --quiet || git commit -m 'Save genuine Lab 6 NLP task outputs'
          git pull --rebase origin main
          git push origin HEAD:main
