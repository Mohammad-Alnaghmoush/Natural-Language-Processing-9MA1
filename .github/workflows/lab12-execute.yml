name: Execute Lab 12 BERT attention and save all outputs
on:
  push:
    paths:
      - '.github/workflows/lab12-execute.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      HF_HUB_ETAG_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install transformer and notebook dependencies
        run: python -m pip install --quiet 'transformers==4.46.3' 'huggingface-hub<1' pandas numpy matplotlib nbformat nbclient ipykernel
      - name: Download pretrained model weights and run all notebook cells
        run: python execute_lab12.py
      - name: Commit notebook with real model outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lab12_Transformers_Completed_Mohammad_Alnaghmoush.ipynb
          git diff --cached --quiet || git commit -m 'Save verified BERT Lab 12 attention weights and heatmap'
          git pull --rebase origin main
          git push origin HEAD:main
